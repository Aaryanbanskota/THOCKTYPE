<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Ambient Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Switch Icon Gradient -->
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Background Layer -->
  <rect width="1280" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1280" height="420" rx="20" fill="url(#amberGlow)"/>
  <rect width="1280" height="420" rx="20" fill="url(#cyanGlow)"/>
  <rect width="1280" height="420" rx="20" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle Mechanical Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M 0 60 L 1280 60 M 0 120 L 1280 120 M 0 180 L 1280 180 M 0 240 L 1280 240 M 0 300 L 1280 300 M 0 360 L 1280 360" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420 M 1200 0 L 1200 420" />
  </g>

  <!-- Left Content Block -->
  <g transform="translate(80, 85)">
    <!-- Pill Tag -->
    <rect width="260" height="28" rx="14" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="130" y="18" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
      ACOUSTIC TYPING BENCHMARK
    </text>

    <!-- Main Title -->
    <text x="0" y="82" fill="url(#titleGrad)" font-size="60" font-weight="900" letter-spacing="-1.5" class="font-sans">
      THOCKTYPE
    </text>

    <!-- Tagline Subtitle -->
    <text x="0" y="122" fill="#a1a1aa" font-size="19" font-weight="500" class="font-sans">
      Studio-Grade Mechanical Typing Laboratory &amp; Sound Playground
    </text>

    <!-- Description -->
    <text x="0" y="156" fill="#71717a" font-size="13" font-weight="400" class="font-sans">
      High-fidelity audio synthesis across 8 authentic mechanical switches • Real-time WPM analytics • 100% offline
    </text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: 8 Switches -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#f59e0b"/>
        <text x="32" y="21" fill="#e4e4e7" font-size="12" font-weight="600" class="font-mono">8 Switch Profiles</text>
      </g>

      <!-- Pill 2: Web Audio API -->
      <g transform="translate(192, 0)">
        <rect width="170" height="34" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#06b6d4"/>
        <text x="32" y="21" fill="#e4e4e7" font-size="12" font-weight="600" class="font-mono">Web Audio Engine</text>
      </g>

      <!-- Pill 3: 24 Badges -->
      <g transform="translate(374, 0)">
        <rect width="170" height="34" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#a855f7"/>
        <text x="32" y="21" fill="#e4e4e7" font-size="12" font-weight="600" class="font-mono">24 Accolades</text>
      </g>

      <!-- Pill 4: Zero Tracking -->
      <g transform="translate(556, 0)">
        <rect width="180" height="34" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#10b981"/>
        <text x="32" y="21" fill="#e4e4e7" font-size="12" font-weight="600" class="font-mono">Zero Signup (Local)</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Feature Card: Isometric Key Switch Emblem -->
  <g transform="translate(920, 80)">
    <!-- Decorative Shadow Container -->
    <rect width="260" height="260" rx="32" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>

    <!-- Keycap Shape / Switch Housing Art -->
    <g transform="translate(60, 48)">
      <!-- Outer Switch Base -->
      <rect x="0" y="20" width="140" height="120" rx="18" fill="#121214" stroke="#3f3f46" stroke-width="2"/>
      <rect x="10" y="10" width="120" height="100" rx="14" fill="#1c1917" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>

      <!-- Cross Stem (Mechanical MX Stem) -->
      <rect x="56" y="32" width="28" height="56" rx="4" fill="url(#switchGrad)"/>
      <rect x="42" y="46" width="56" height="28" rx="4" fill="url(#switchGrad)"/>
      <circle cx="70" cy="60" r="5" fill="#fef3c7"/>

      <!-- Sound Waves Effect -->
      <path d="M 10 70 A 50 50 0 0 0 10 30" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M -8 82 A 70 70 0 0 0 -8 18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

      <path d="M 130 30 A 50 50 0 0 1 130 70" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 148 18 A 70 70 0 0 1 148 82" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    </g>

    <!-- Bottom Badge in Card -->
    <text x="130" y="222" fill="#d4d4d8" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle" class="font-mono">
      100% CLIENT AUDIO
    </text>
  </g>
</svg>
